name = "nando-prestige"
main = "src/worker.js"
compatibility_date = "2026-10-29"

# Attach a custom domain in Cloudflare when ready, e.g.:
# routes = [
#   { pattern = "nandoprestige.com", custom_domain = true },
#   { pattern = "www.nandoprestige.com", custom_domain = true }
# ]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
SITE_NAME = "Nando Prestige"
SITE_URL = "https://nandoprestige.example"
OFFER_PRICE_CENTS = "1900"
OFFER_CURRENCY = "eur"
OFFER_NAME = "Nando Prestige Reels Pack"

[observability]
enabled = true

# Secrets (set via `wrangler secret put`, never commit):
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
# Optional plain vars: STRIPE_PRICE_ID
